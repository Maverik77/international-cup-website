<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="International Cup 2026 - full results, match by match and hole by hole">
    <title>Results - International Cup 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=b4f95ec1">

    <style>
        /* ---- page shell ---------------------------------------------- */
        .results-page { background: #f7fafc; }
        .results-main { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem 4rem; }

        .results-hero {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: #fff;
            padding: 7rem 1.25rem 2.75rem;
            text-align: center;
        }
        .results-hero h1 { margin: 0 0 0.35rem; font-size: 2.1rem; }
        .results-hero p  { margin: 0; opacity: 0.85; font-size: 0.98rem; }

        /* ---- final score --------------------------------------------- */
        .final {
            max-width: 560px;
            margin: 2rem auto 0;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 14px;
            padding: 1.25rem 1rem 1rem;
        }
        .final-label {
            text-transform: uppercase; letter-spacing: 0.14em;
            font-size: 0.7rem; opacity: 0.8; margin-bottom: 0.5rem;
        }
        .final-line {
            display: flex; align-items: center; justify-content: center;
            gap: 1rem; flex-wrap: wrap;
        }
        .final-team { font-weight: 600; font-size: 1rem; white-space: nowrap; }
        .final-numbers { font-size: 2.1rem; font-weight: 700; letter-spacing: 0.02em; }
        .final-winner { margin-top: 0.6rem; font-size: 0.92rem; opacity: 0.92; }

        /* ---- day tabs ------------------------------------------------- */
        .day-tabs {
            display: flex; gap: 0.5rem; justify-content: center;
            margin: -1.5rem auto 2rem; max-width: 460px;
            background: #fff; padding: 0.4rem; border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.09);
            position: relative; z-index: 2;
        }
        .day-tab {
            flex: 1; border: 0; background: transparent; cursor: pointer;
            padding: 0.7rem 0.5rem; border-radius: 9px; font: inherit;
            font-weight: 600; color: #4a5568; transition: background 0.18s, color 0.18s;
        }
        .day-tab:hover { background: #f1f5f9; }
        .day-tab[aria-selected="true"] { background: var(--primary-color); color: #fff; }

        .day-panel[hidden] { display: none; }

        /* ---- day + session headers ------------------------------------ */
        .day-head { text-align: center; margin-bottom: 1.75rem; }
        .day-head h2 { margin: 0 0 0.3rem; font-size: 1.5rem; color: var(--text-dark); }
        .day-head .day-meta { color: #718096; font-size: 0.9rem; }
        .day-score {
            margin-top: 0.6rem; font-size: 1.35rem; font-weight: 700; color: var(--text-dark);
        }
        .day-score .sep { color: #cbd5e0; margin: 0 0.45rem; }

        .session { margin-bottom: 2.25rem; }
        .session-head {
            display: flex; align-items: baseline; justify-content: space-between;
            gap: 1rem; padding: 0 0.2rem 0.6rem;
            border-bottom: 2px solid var(--light-gray); margin-bottom: 0.75rem;
        }
        .session-head h3 { margin: 0; font-size: 1.12rem; color: var(--text-dark); }
        .session-holes {
            font-weight: 500; font-size: 0.82rem; color: #718096;
            margin-left: 0.5rem; white-space: nowrap;
        }
        .session-score { font-weight: 700; color: var(--text-dark); white-space: nowrap; }
        .session-note { color: #718096; font-size: 0.86rem; margin: 0.6rem 0.2rem 0; }

        /* ---- a match row ---------------------------------------------- */
        .match { background: #fff; border: 1px solid var(--light-gray);
                 border-radius: 10px; margin-bottom: 0.5rem; overflow: hidden; }
        .match[open] { border-color: #cbd5e0; box-shadow: 0 3px 14px rgba(0,0,0,0.07); }
        .match > summary {
            list-style: none; cursor: pointer; padding: 0.7rem 0.9rem;
            display: grid; grid-template-columns: 1.75rem 1fr auto 1fr 1.1rem;
            align-items: center; gap: 0.6rem;
        }
        .match > summary::-webkit-details-marker { display: none; }
        .match > summary:hover { background: #f9fafb; }
        .m-num { color: #a0aec0; font-size: 0.82rem; font-weight: 600; text-align: center; }
        .m-side { font-size: 0.92rem; min-width: 0; }
        .m-side.right { text-align: right; }
        .m-side.won  { font-weight: 600; color: var(--text-dark); }
        .m-side.lost { color: #a0aec0; }
        .m-side.half { color: #4a5568; }
        .m-result {
            font-size: 0.78rem; font-weight: 600; padding: 0.2rem 0.55rem;
            border-radius: 999px; white-space: nowrap; text-align: center;
        }
        .m-result.usa  { background: #fdeaec; color: #a4142c; }
        .m-result.intl { background: #e7f0fd; color: #14468f; }
        .m-result.tie  { background: #fff6e0; color: #8a6d1f; }
        .m-caret { color: #cbd5e0; font-size: 0.75rem; text-align: center; transition: transform 0.18s; }
        .match[open] .m-caret { transform: rotate(90deg); }

        /* ---- the scorecard -------------------------------------------- */
        .card-wrap { border-top: 1px solid var(--light-gray); padding: 0.85rem; overflow-x: auto; }
        table.card { border-collapse: collapse; width: 100%; font-size: 0.82rem; min-width: 460px; }
        table.card.wide { min-width: 860px; font-size: 0.78rem; }
        table.card th, table.card td { padding: 0.32rem 0.2rem; text-align: center; }
        table.card th.lab, table.card td.lab {
            text-align: left; white-space: nowrap; padding-left: 0.35rem;
            padding-right: 0.8rem; min-width: 10.5rem; font-weight: 500;
        }
        table.card thead th {
            font-size: 0.72rem; color: #718096; font-weight: 600;
            border-bottom: 1px solid var(--light-gray);
        }
        table.card th.sep, table.card td.sep { background: #f7fafc; font-weight: 600; }
        .row-side td { background: #f7fafc; font-weight: 600; color: var(--text-dark);
                       font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.06em; }
        .row-side td.lab .flag { margin-right: 0.3rem; }
        .row-player td { color: #2d3748; }
        .row-player td.lab { color: #4a5568; }
        .hcp { color: #a0aec0; font-weight: 400; }
        .stroke { position: relative; }
        .stroke::after {
            content: ''; position: absolute; top: 2px; right: 3px;
            width: 4px; height: 4px; border-radius: 50%; background: #cbd5e0;
        }
        .row-net td { border-top: 1px dashed var(--light-gray); font-weight: 600; color: #2d3748; }
        .row-net td.lab { color: #718096; font-weight: 500; }
        .won-usa  { background: #fdeaec; color: #a4142c; border-radius: 4px; }
        .won-intl { background: #e7f0fd; color: #14468f; border-radius: 4px; }
        .row-status td {
            border-top: 1px solid var(--light-gray); font-size: 0.72rem;
            color: #718096; font-weight: 600; padding-top: 0.45rem;
        }
        .row-status td.lab { color: #a0aec0; font-weight: 500; }
        .st-usa { color: #a4142c; } .st-intl { color: #14468f; } .st-as { color: #a0aec0; }
        .no-card { padding: 0.9rem; color: #718096; font-size: 0.87rem; }
        .card-legend { padding: 0 0.9rem 0.85rem; color: #a0aec0; font-size: 0.74rem; }

        .loading, .load-error { text-align: center; padding: 3rem 1rem; color: #718096; }

        @media (max-width: 640px) {
            .results-hero { padding-top: 6rem; }
            .results-hero h1 { font-size: 1.6rem; }
            .final-numbers { font-size: 1.7rem; }
            .match > summary { grid-template-columns: 1.4rem 1fr 1.1rem; row-gap: 0.3rem; }
            .m-side.right { grid-column: 2; text-align: left; }
            .m-result { grid-column: 2; justify-self: start; margin-top: 0.1rem; }
            .m-caret { grid-row: 1; grid-column: 3; }
            table.card th.lab, table.card td.lab { min-width: 8.5rem; }
        }
    </style>
</head>
<body class="results-page">
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo"><a href="index.html"><h1>International Cup</h1></a></div>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html#home" class="nav-link">Home</a>
                <a href="index.html#news" class="nav-link">News</a>
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#format" class="nav-link">Format</a>
                <a href="index.html#teams" class="nav-link">Teams</a>
                <a href="index.html#schedule" class="nav-link">Schedule</a>
                <a href="results.html" class="nav-link active">Results</a>
                <a href="photos.html" class="nav-link">Photos</a>
                <a href="betting.html" class="nav-link">Betting</a>
                <a href="history/" class="nav-link">Archive</a>
            </div>
            <div class="nav-hamburger" id="nav-hamburger">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </div>
        </div>
    </nav>

    <header class="results-hero">
        <h1>2026 Results</h1>
        <p>Every match, hole by hole</p>
        <div class="final" id="final" hidden>
            <div class="final-label">Final</div>
            <div class="final-line">
                <span class="final-team">&#127482;&#127480; USA</span>
                <span class="final-numbers"><span id="final-usa">0</span> &ndash; <span id="final-intl">0</span></span>
                <span class="final-team">&#127757; International</span>
            </div>
            <div class="final-winner" id="final-winner"></div>
        </div>
    </header>

    <main class="results-main">
        <div class="day-tabs" role="tablist">
            <button class="day-tab" role="tab" id="tab-1" aria-controls="panel-1" aria-selected="true">Day 1 &middot; Team Matches</button>
            <button class="day-tab" role="tab" id="tab-2" aria-controls="panel-2" aria-selected="false">Day 2 &middot; Singles</button>
        </div>

        <div id="content" class="loading">Loading results&hellip;</div>
    </main>

    <script src="js/main.js?v=811cd19b"></script>
    <script>
    (function () {
        'use strict';

        var esc = function (s) {
            var d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        };
        // 1 and 0 are whole points, a halved segment is 0.5. Trailing zeros just
        // add noise to a scoreline, so 2.5 stays 2.5 and 3.0 becomes 3.
        var pts = function (n) {
            var v = Number(n);
            return Number.isInteger(v) ? String(v) : v.toFixed(1);
        };
        var sideClass = function (winner, side) {
            if (winner === 'tie') return 'half';
            return winner === side ? 'won' : 'lost';
        };
        // `text` is already-escaped markup, not a raw string: the scoreline
        // carries an en dash entity and must not be escaped a second time.
        var resultPill = function (winner, text) {
            var cls = winner === 'USA' ? 'usa' : winner === 'International' ? 'intl' : 'tie';
            return '<span class="m-result ' + cls + '">' + text + '</span>';
        };
        var statusCell = function (s) {
            var cls = s === 'AS' ? 'st-as' : s.indexOf('USA') === 0 ? 'st-usa' : 'st-intl';
            return '<span class="' + cls + '">' + esc(s) + '</span>';
        };
        // A hole's cell is tinted for whoever won it; the other side's cell and a
        // halved hole stay plain, so the colour reads as "this side took it".
        var winClass = function (holeWinner, side) {
            if (holeWinner !== side) return '';
            return side === 'USA' ? 'won-usa' : 'won-intl';
        };

        function scoreCells(player, holeWinners, side, holes) {
            return holes.map(function (h, i) {
                var v = player.scores[i];
                if (v === null || v === undefined) return '<td>&ndash;</td>';
                var cls = [];
                if (player.strokes && player.strokes[i]) cls.push('stroke');
                return '<td class="' + cls.join(' ') + '">' + esc(v) + '</td>';
            }).join('');
        }

        /* ---- Day 1: six holes, a side may field one ball or two ---- */
        function day1Card(c) {
            var holes = c.holes;
            var head = '<tr><th class="lab">Hole</th>' +
                holes.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
                '<th class="sep">Tot</th></tr>';

            function sideBlock(sd, side, flag, label) {
                var rows = '<tr class="row-side"><td class="lab" colspan="' + (holes.length + 2) + '">' +
                    '<span class="flag">' + flag + '</span>' + esc(label) + '</td></tr>';
                rows += sd.players.map(function (p) {
                    return '<tr class="row-player"><td class="lab">' + esc(p.name) +
                        (p.handicap === null || p.handicap === undefined ? '' :
                            ' <span class="hcp">(' + esc(p.handicap) + ')</span>') + '</td>' +
                        scoreCells(p, c.holeWinners, side, holes) +
                        '<td class="sep">' + (p.total === null || p.total === undefined ? '&ndash;' : esc(p.total)) + '</td></tr>';
                }).join('');
                rows += '<tr class="row-net"><td class="lab">Net</td>' +
                    holes.map(function (h, i) {
                        var v = sd.net[i];
                        var cls = winClass(c.holeWinners[i], side);
                        return '<td class="' + cls + '">' + (v === null || v === undefined ? '&ndash;' : esc(v)) + '</td>';
                    }).join('') + '<td class="sep"></td></tr>';
                return rows;
            }

            var statusRow = '<tr class="row-status"><td class="lab">Match</td>' +
                holes.map(function (h, i) {
                    var s = c.status[i];
                    return '<td>' + (s ? statusCell(s) : '') + '</td>';
                }).join('') + '<td class="sep"></td></tr>';

            return '<div class="card-wrap"><table class="card"><thead>' + head + '</thead><tbody>' +
                sideBlock(c.usa, 'USA', '&#127482;&#127480;', c.usa.team.join(' & ')) +
                sideBlock(c.intl, 'International', '&#127757;', c.intl.team.join(' & ')) +
                statusRow +
                '</tbody></table></div>' +
                '<p class="card-legend">Gross scores. A dot marks a hole where that side had a stroke; the Net row is what the hole was won on.</p>';
        }

        /* ---- Day 2: eighteen holes, one player a side ---- */
        function day2Card(m) {
            if (m.card === false) {
                return '<p class="no-card">This scorecard is not in the club&rsquo;s export &mdash; the file stops part-way ' +
                    'through the card list, so the round was never printed. Front nine, back nine and the full eighteen ' +
                    'went ' + esc(m.segments.join(', ')) + '.</p>';
            }
            var holes = m.holes;
            function headRow() {
                var h = '<tr><th class="lab">Hole</th>';
                for (var i = 1; i <= 9; i++) h += '<th>' + i + '</th>';
                h += '<th class="sep">Out</th>';
                for (var j = 10; j <= 18; j++) h += '<th>' + j + '</th>';
                h += '<th class="sep">In</th><th class="sep">Tot</th><th class="sep">Net</th></tr>';
                return h;
            }
            function playerRow(p, side, flag) {
                var cells = '';
                for (var i = 0; i < 18; i++) {
                    var v = p.scores[i];
                    var cls = [winClass(m.holeWinners[i], side)];
                    if (p.strokes[i]) cls.push('stroke');
                    cells += '<td class="' + cls.join(' ').trim() + '">' +
                        (v === null || v === undefined ? '&ndash;' : esc(v)) + '</td>';
                    if (i === 8) cells += '<td class="sep">' + esc(p.out) + '</td>';
                }
                cells += '<td class="sep">' + esc(p['in']) + '</td>' +
                         '<td class="sep">' + esc(p.total) + '</td>' +
                         '<td class="sep">' + esc(p.net) + '</td>';
                return '<tr class="row-player"><td class="lab"><span class="flag">' + flag + '</span> ' +
                    esc(p.name) + (p.handicap === null || p.handicap === undefined ? ''
                        : ' <span class="hcp">(' + esc(p.handicap) + ')</span>') +
                    '</td>' + cells + '</tr>';
            }
            var status = '<tr class="row-status"><td class="lab">Match</td>';
            for (var i = 0; i < 18; i++) {
                var s = m.status[i];
                status += '<td>' + (s ? statusCell(s) : '') + '</td>';
                if (i === 8) status += '<td class="sep"></td>';
            }
            status += '<td class="sep"></td><td class="sep"></td><td class="sep"></td></tr>';

            return '<div class="card-wrap"><table class="card wide"><thead>' + headRow() + '</thead><tbody>' +
                playerRow(m.usa, 'USA', '&#127482;&#127480;') +
                playerRow(m.intl, 'International', '&#127757;') +
                status +
                '</tbody></table></div>' +
                '<p class="card-legend">Gross scores, with a dot where a stroke was given. Holes are won on the net score. ' +
                'Front nine, back nine and the full eighteen are each worth a point: ' + esc(m.segments.join(', ')) + '.</p>';
        }

        function matchRow(num, usaLabel, intlLabel, winner, resultText, body) {
            return '<details class="match">' +
                '<summary>' +
                    '<span class="m-num">' + num + '</span>' +
                    '<span class="m-side ' + sideClass(winner, 'USA') + '">' + esc(usaLabel) + '</span>' +
                    resultPill(winner, resultText) +
                    '<span class="m-side right ' + sideClass(winner, 'International') + '">' + esc(intlLabel) + '</span>' +
                    '<span class="m-caret">&#9654;</span>' +
                '</summary>' + body + '</details>';
        }

        function renderDay1(day, cardsDoc) {
            var html = '<div class="day-head"><h2>' + esc(day.label) + '</h2>' +
                '<div class="day-meta">' + esc(day.course) + '</div>' +
                '<div class="day-score">USA ' + pts(day.usa) + '<span class="sep">&ndash;</span>' +
                pts(day.intl) + ' International</div></div>';

            day.sessions.forEach(function (se) {
                var sc = cardsDoc.day1.sessions.filter(function (x) { return x.name === se.name; })[0];
                html += '<section class="session"><div class="session-head">' +
                    '<h3>' + esc(se.name) + '<span class="session-holes">holes ' + esc(se.holes) + '</span></h3>' +
                    '<span class="session-score">' + pts(se.usa) + ' &ndash; ' + pts(se.intl) + '</span></div>';
                if (sc) {
                    html += sc.cards.map(function (c) {
                        var text = c.winner === 'tie' ? 'halved'
                            : (c.winner === 'USA' ? 'USA ' : 'INT ') + esc(c.result);
                        return matchRow(c.match, c.usa.team.join(' & '), c.intl.team.join(' & '),
                            c.winner, text, day1Card(c));
                    }).join('');
                }
                if (se.note) html += '<p class="session-note">' + esc(se.note) + '</p>';
                html += '</section>';
            });
            html += '<p class="session-note">' + esc(day.pairingsNote || '') + '</p>';
            return html;
        }

        function renderDay2(day, cardsDoc) {
            var html = '<div class="day-head"><h2>' + esc(day.label) + '</h2>' +
                '<div class="day-meta">' + esc(day.course) + '</div>' +
                '<div class="day-score">USA ' + pts(day.usa) + '<span class="sep">&ndash;</span>' +
                pts(day.intl) + ' International</div></div><section class="session">';

            html += cardsDoc.day2.matches.map(function (m) {
                var rec = day.matches.filter(function (x) { return x.match === m.match; })[0] || {};
                var text = pts(rec.usaPoints) + ' &ndash; ' + pts(rec.intlPoints);
                var usaName = m.usa.name, intlName = m.intl.name;
                return matchRow(m.match, usaName, intlName, rec.winner, text, day2Card(m));
            }).join('');

            var missing = cardsDoc.day2.matches.filter(function (m) { return m.card === false; }).length;
            html += '</section>';
            if (missing) {
                html += '<p class="session-note">' + missing + ' of the ' + day.matches.length +
                    ' singles are shown without a scorecard. Those rounds were played and scored like ' +
                    'every other &mdash; the club&rsquo;s export simply runs out before it reaches them. ' +
                    'They will appear here once a complete export is in.</p>';
            }
            return html;
        }

        function show(day) {
            document.getElementById('tab-1').setAttribute('aria-selected', day === 1 ? 'true' : 'false');
            document.getElementById('tab-2').setAttribute('aria-selected', day === 2 ? 'true' : 'false');
            var p1 = document.getElementById('panel-1'), p2 = document.getElementById('panel-2');
            if (p1) p1.hidden = day !== 1;
            if (p2) p2.hidden = day !== 2;
            try { history.replaceState(null, '', '#day' + day); } catch (e) { /* file:// */ }
        }

        Promise.all([
            fetch('./data/results.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }),
            fetch('./data/scorecards.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); })
        ]).then(function (res) {
            var doc = res[0], cards = res[1];
            var d1 = doc.days.filter(function (d) { return d.day === 1; })[0];
            var d2 = doc.days.filter(function (d) { return d.day === 2; })[0];

            if (doc.final) {
                document.getElementById('final-usa').textContent = pts(doc.final.usa);
                document.getElementById('final-intl').textContent = pts(doc.final.intl);
                document.getElementById('final-winner').textContent =
                    doc.final.winner + ' win the 2026 Cup';
                document.getElementById('final').hidden = false;
            }

            document.getElementById('content').outerHTML =
                '<div id="panel-1" class="day-panel" role="tabpanel" aria-labelledby="tab-1">' + renderDay1(d1, cards) + '</div>' +
                '<div id="panel-2" class="day-panel" role="tabpanel" aria-labelledby="tab-2" hidden>' + renderDay2(d2, cards) + '</div>';

            document.getElementById('tab-1').addEventListener('click', function () { show(1); });
            document.getElementById('tab-2').addEventListener('click', function () { show(2); });
            show(location.hash === '#day2' ? 2 : 1);
        }).catch(function (err) {
            console.error('Error loading results:', err);
            document.getElementById('content').className = 'load-error';
            document.getElementById('content').textContent =
                'Results could not be loaded. Please try again later.';
        });
    })();
    </script>
</body>
